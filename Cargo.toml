[package]
name = "desox"
version = "0.5.1"
edition = "2024"
license = "MIT"
authors = ["Paul Tagliamonte <paultag@gmail.com>"]
repository = "https://github.com/paultag/desox-rs"
description = "(incomplete) MIFARE DESFire EV3 APDU bindings."

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(desox_replay_rw)'] }

[features]
default = []
pcsc = ["dep:pcsc"]
tracing = ["dep:tracing", "std", "dep:hex"]
std = []

[dependencies]
aes = "0.9"
cbc = "0.2"
crc32fast = { version = "1.5", default-features = false }
des = { version = "0.9" }
getrandom = { version = "0.4" }
hex = { version = "0.4", optional = true }
pcsc = { version = "2.9", optional = true }
thiserror = { version = "2.0", default-features = false }
tokio = { version = "1.20", features = ["io-util", "fs", "sync"] }
tracing = { version = "0.1", optional = true, default-features = false, features = ["attributes"] }

[dev-dependencies]
tokio = { version = "1.20", features = ["full"] }
hex = { version = "0.4" }
hex-literal = { version = "1.1" }
